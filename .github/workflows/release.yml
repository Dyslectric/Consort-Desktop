name: Release

# Builds the downloadable artifacts and attaches them to a GitHub release.
#
# electron-builder creates the release as a *draft*, so a tag push produces
# something to look at rather than something published. Publishing it is a
# deliberate click.
#
# The two jobs run in sequence rather than as a matrix: both publish into the
# same draft, and two runners creating that draft at the same moment race.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions: {}

jobs:
  linux:
    name: Linux archive (tar.xz)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm exec electron-vite build

      - name: Build and upload
        run: pnpm exec electron-builder --linux tar.xz --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows installer (nsis)
    needs: linux
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm exec electron-vite build

      # Unsigned: there is no code-signing certificate for this project, so
      # Windows SmartScreen will warn on first run. Signing is a purchase and a
      # secret, not a build flag.
      - name: Build and upload
        run: pnpm exec electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
